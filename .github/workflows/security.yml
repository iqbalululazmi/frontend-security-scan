name: security-scan-and-build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      path:
        description: Project folder to scan and build
        default: dummy-projects/clean/react-vite

env:
  TARGET: ${{ inputs.path || 'dummy-projects/clean/react-vite' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rule unit tests
        run: python3 scan.py self-test
      - name: Fixture check (vulnerable/ must be caught, clean/ must report 0)
        run: python3 tests/verify_dummy.py
      - name: Security scan (SSRF, XSS, secrets; enforce mode)
        run: python3 scan.py scan "$TARGET" --mode enforce --fail-on ERROR
      - name: Publish summary
        if: always()
        run: cat security-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/

  build:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: ${{ env.TARGET }}
      - run: npm run build
        working-directory: ${{ env.TARGET }}
