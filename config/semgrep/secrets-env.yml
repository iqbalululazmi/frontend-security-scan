rules:
  # ---------------------------------------------------------------------------
  # Secrets in dotenv files. Only files that are *tracked/committed* are scanned (Semgrep
  # follows git), so a correctly gitignored .env is never reported. Templates such as
  # .env.example are skipped. Placeholder values (empty, changeme, your-..., <...>, xxx)
  # are ignored.
  # ---------------------------------------------------------------------------
  - id: secret-env-file-committed
    languages: [generic]
    severity: ERROR
    message: >-
      A committed .env file contains a real-looking secret (password, token, API key, private key
      or database credentials). Anything in git history must be treated as leaked: rotate it, remove
      the file from git, add it to .gitignore and commit only a .env.example with placeholders.
    metadata:
      category: secret
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      likelihood: HIGH
    paths:
      include: [".env", ".env.*", "*.env"]
      exclude: [".env.example", ".env.sample", ".env.template", ".env.dist", "*.example", "*.sample", "*.template"]
    pattern-either:
      # NAME_WITH_SECRET_WORD=value   (public-prefixed names are reported by secret-public-env-prefix)
      - pattern-regex: >-
          (?mi)^[ \t]*(?:export[ \t]+)?(?!(?:NEXT_PUBLIC|VITE|REACT_APP|PUBLIC|EXPO_PUBLIC|GATSBY|NUXT_PUBLIC)_)[A-Z0-9_]*(?:SECRET|PASSWORD|PASSWD|TOKEN|PRIVATE_KEY|API_KEY|APIKEY|ACCESS_KEY|CLIENT_SECRET|SERVICE_ROLE)[A-Z0-9_]*[ \t]*=[ \t]*(?!["']?(?:$|#|changeme|change-me|your[-_ ]|<|xxx|example|placeholder|todo|\$\{|\$\())[^\s#]{6,}
      # DATABASE_URL=scheme://user:password@host/db
      - pattern-regex: >-
          (?mi)^[ \t]*(?:export[ \t]+)?[A-Z0-9_]*(?:DATABASE|DB|REDIS|MONGO|AMQP)[A-Z0-9_]*URL[ \t]*=[ \t]*["']?[a-z][a-z0-9+.-]*://[^:\s/@]+:(?!(?:password|changeme|pass|xxx|\$\{))[^@\s]{3,}@

  - id: secret-public-env-prefix
    languages: [generic]
    severity: ERROR
    message: >-
      A secret-looking variable carries a client-exposed prefix (NEXT_PUBLIC_, VITE_, REACT_APP_, ...).
      The bundler inlines its value into the JavaScript sent to every browser, so it is public by
      definition. Keep real secrets server-side without the prefix; only publishable values
      (e.g. Stripe pk_..., map tokens restricted by referrer) may be public.
    metadata:
      category: secret
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor", "CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
    paths:
      include: [".env", ".env.*", "*.env"]
      exclude: [".env.example", ".env.sample", ".env.template", ".env.dist", "*.example", "*.sample", "*.template"]
    pattern-regex: >-
      (?mi)^[ \t]*(?:export[ \t]+)?(?:NEXT_PUBLIC|VITE|REACT_APP|PUBLIC|EXPO_PUBLIC|GATSBY|NUXT_PUBLIC)_[A-Z0-9_]*(?:SECRET|PRIVATE|PASSWORD|PASSWD|TOKEN|SERVICE_ROLE)[A-Z0-9_]*[ \t]*=[ \t]*(?!["']?(?:$|#|pk_|pk\.|your[-_ ]|changeme|<|xxx|example|placeholder))[^\s#]{6,}
