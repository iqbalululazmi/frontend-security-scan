rules:
  # ---------------------------------------------------------------------------
  # Secrets in source code (any file type for keys/tokens; JS/TS for assignments and env reads).
  # ---------------------------------------------------------------------------
  - id: secret-private-key-block
    languages: [generic]
    severity: ERROR
    message: >-
      A private key (PEM block) is committed. Treat it as compromised: revoke/rotate the key pair,
      remove it from the repository and load keys from a secret manager or an untracked file.
    metadata:
      category: secret
      cwe: ["CWE-321: Use of Hard-coded Cryptographic Key"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
    paths:
      exclude: ["*.md", "*.test.*", "*.spec.*", "__tests__", "*.example", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
    pattern-regex: >-
      -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?:\x20BLOCK)?-----

  - id: secret-provider-token
    languages: [generic]
    severity: ERROR
    message: >-
      A credential with a well-known provider format (AWS access key, GitHub token, Stripe live key,
      Slack token, SendGrid key, npm token) is committed. Revoke and rotate it, then load it from
      an environment variable or secret manager.
    metadata:
      category: secret
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
    paths:
      exclude: ["*.md", "*.test.*", "*.spec.*", "__tests__", "*.example", ".env.example", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"]
    pattern-either:
      - pattern-regex: \b(?:AKIA|ASIA)[0-9A-Z]{16}\b
      - pattern-regex: \bgh[pousr]_[A-Za-z0-9]{36,}\b
      - pattern-regex: \b[sr]k_live_[0-9a-zA-Z]{20,}\b
      - pattern-regex: \bxox[abprs]-[A-Za-z0-9-]{10,}
      - pattern-regex: \bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b
      - pattern-regex: \bnpm_[A-Za-z0-9]{36}\b

  - id: secret-hardcoded-assignment
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A variable or property named like a secret (password, secret, token, api key) is assigned a long
      string literal. Read it from process.env / a secret manager instead of committing it.
    metadata:
      category: secret
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
    paths:
      exclude: ["*.test.*", "*.spec.*", "__tests__"]
    pattern-regex: >-
      (?i)(?:password|passwd|secret|api_?key|access_?token|auth_?token|private_?key|client_?secret)\w*["']?[ \t]*[:=][ \t]*["'](?!(?:your|change|example|placeholder|xxx|test|dummy))[A-Za-z0-9_\-+/=.]{20,}["']

  - id: secret-public-env-prefix-in-code
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Code reads a secret-looking variable that has a client-exposed prefix (NEXT_PUBLIC_, VITE_,
      REACT_APP_, ...). Bundlers inline these values into the browser bundle, so the secret is public.
      Move it server-side (no prefix) and call it from an API route or server action.
    metadata:
      category: secret
      cwe: ["CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      impact: HIGH
      likelihood: HIGH
    patterns:
      - pattern-either:
          - pattern: process.env.$VAR
          - pattern: import.meta.env.$VAR
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(?:NEXT_PUBLIC|VITE|REACT_APP|PUBLIC|EXPO_PUBLIC|GATSBY|NUXT_PUBLIC)_\w*(?:SECRET|PRIVATE|PASSWORD|PASSWD|TOKEN|SERVICE_ROLE)\w*$
